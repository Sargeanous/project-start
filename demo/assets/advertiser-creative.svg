<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a52"/>
      <stop offset="0.55" stop-color="#7b2d6b"/>
      <stop offset="1" stop-color="#e0663c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0663c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
  </defs>
  <rect width="1536" height="1024" fill="url(#sky)"/>
  <circle cx="1180" cy="250" r="120" fill="#ffd9a0" opacity="0.9"/>
  <rect y="720" width="1536" height="304" fill="url(#water)"/>
  <!-- skyline silhouette -->
  <g fill="#160c2b" opacity="0.85">
    <rect x="120" y="520" width="60" height="200"/>
    <rect x="200" y="470" width="48" height="250"/>
    <rect x="266" y="560" width="70" height="160"/>
    <rect x="360" y="430" width="40" height="290"/>
    <rect x="420" y="540" width="90" height="180"/>
    <rect x="1020" y="500" width="54" height="220"/>
    <rect x="1090" y="450" width="44" height="270"/>
    <rect x="1150" y="560" width="80" height="160"/>
    <rect x="1250" y="480" width="46" height="240"/>
    <rect x="1310" y="540" width="90" height="180"/>
  </g>
  <text x="110" y="140" fill="#ffe4c7" font-size="30" letter-spacing="8" opacity="0.95">AZURE HOTELS</text>
  <text x="768" y="440" fill="#ffffff" font-size="96" font-weight="700" text-anchor="middle">Corniche Summer Nights</text>
  <text x="768" y="540" fill="#ffe4c7" font-size="70" font-weight="600" text-anchor="middle" direction="rtl">ليالي الكورنيش الصيفية</text>
  <!-- deliberately small call to action -->
  <text x="768" y="960" fill="#ffd9a0" font-size="24" text-anchor="middle" opacity="0.9">Book now at azure-hotels.ae  ·  احجز الآن</text>
